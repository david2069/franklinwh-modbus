site_name: FranklinWH Modbus
site_description: Python library & CLI for controlling FranklinWH battery systems via Modbus TCP
site_url: https://david2069.github.io/franklinwh-modbus
repo_url: https://github.com/david2069/franklinwh-modbus
repo_name: david2069/franklinwh-modbus

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Setup Guide: GETTING_STARTED.md
    - Python Integration: HOWTO_PYTHON.md
    - Modbus Protocol Guide: FRANKLINWH_MODBUS_GUIDE.md
    - What is Modbus TCP?: WHAT_IS_MODBUS_TCP.md
    - Architecture Overview: ARCHITECTURE.md
  - Command Line Tools:
    - CLI Command Reference: CLI_COMMAND_REFERENCE.md
    - Modbus Reader Reference: MODBUS_READER_REFERENCE.md
    - TUI Monitor Guide: TUI_MONITOR_GUIDE.md
    - Infopoint Sequencer Guide: SUNSPEC_SEQUENCER_GUIDE.md
    - 6-Phase Sequencing Protocol: SUNSPEC_DER_SEQUENCER_REFERENCE.md
    - Model 704 Control Examples: MODEL_704_CONTROL_EXAMPLES.md
    - SunSpec 700 Series Guide 2: SUNSPEC2_700_SERIES_GUIDE_2.md
    - SunSpec 700 Series Verification Plan: SUNSPEC_700_SERIES_VERIFICATION_PLAN.md
    - Conformance & Telemetry Report: SUNSPEC_700_SERIES_TEST_REPORT.md
  - Control & Safety:
    - DER Control Reference: DER_CONTROL_REFERENCE.md
    - Safety Controls: SAFETY_CONTROLS.md
    - Orchestration Logic: ORCHESTRATION_AND_CONTROL.md
    - VPP Mode Reference: VPP_MODE_REFERENCE.md
    - VPP Terminology: VPP_TERMINOLOGY_XREF.md
    - Virtual Mode Specs: VIRTUAL_MODE_SPECIFICATIONS.md
  - Hardware & Standards:
    - SunSpec Interop Guide: SUNSPEC_700_INTEROP_GUIDE.md
    - SunSpec Quirks: FRANKLINWH_SUNSPEC_QUIRKS.md
    - PICS Conformance: PICS_CONFORMANCE_CROSS_REFERENCE.md
    - Extensions Manifest: FRANKLINWH_EXTENSIONS_MANIFEST.md
    - aGate Network Profile: AGATE_NETWORK_PROFILE.md
    - Finding an aGate (discovery): DISCOVERY.md
    - Hardware Test Guide: HARDWARE_TEST_GUIDE.md
  - Troubleshooting:
    - WiFi DHCP Failure: troubleshooting/2026-03-21_wifi_dhcp_failure.md
  - Project Info:
    - Backlog: backlog.md
    - Changelog: CHANGELOG.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/david2069/franklinwh-modbus

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js
